<title>Krinke Industries</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="Krinke Industries — our new website is under development.">
<meta name="theme-color" content="#32620E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&display=swap">
<style>
  /* Layout: one centred column on a flat field that matches the logo's own green,
     with rolling field rows (taken from the emblem) rising along the bottom edge. */
  :root {
    --field: #32620E;        /* exact logo background */
    --row-1: #2C5A0C;
    --row-2: #264F0A;
    --row-3: #1F4208;
    --wheat: #DB8F1F;        /* wordmark orange */
    --wheat-soft: rgba(219, 143, 31, 0.18);
    --cream: #F6EEDB;
    --sage: #C3D3AE;
    --font: "Poppins", "Segoe UI", system-ui, -apple-system, sans-serif;
    color-scheme: dark;
  }

  html, body { height: 100%; }
  body {
    background: var(--field);
    color: var(--cream);
    font-family: var(--font);
    -webkit-font-smoothing: antialiased;
    overflow-x: hidden;
  }

  .page {
    position: relative;
    min-height: 100%;
    display: flex;
    flex-direction: column;
    box-sizing: border-box;
  }

  main {
    position: relative;
    z-index: 1;
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: clamp(2rem, 5vw, 3.25rem);
    padding-block: clamp(2.5rem, 8vh, 5rem) clamp(9rem, 22vh, 13rem);
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
    text-align: center;
  }

  /* Logo: full lockup on wider screens, stacked emblem + wordmark on phones */
  .logo { display: block; margin: 0; animation: rise 0.9s cubic-bezier(.2,.7,.2,1) both; }
  .logo img { display: block; height: auto; max-width: 100%; }
  .logo-wide img { width: min(860px, 88vw); }
  .logo-stack { display: none; flex-direction: column; align-items: center; gap: 0.75rem; }
  .logo-stack .emblem { width: min(230px, 62vw); }
  .logo-stack .wordmark { width: min(300px, 78vw); }

  @media (max-width: 640px) {
    .logo-wide { display: none; }
    .logo-stack { display: flex; }
  }

  .status {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 1rem;
    max-width: 34rem;
    animation: rise 0.9s 0.15s cubic-bezier(.2,.7,.2,1) both;
  }

  .badge {
    display: inline-flex;
    align-items: center;
    gap: 0.6rem;
    font-size: 0.72rem;
    font-weight: 600;
    letter-spacing: 0.16em;
    text-transform: uppercase;
    color: var(--wheat);
    background: var(--wheat-soft);
    border: 1px solid rgba(219, 143, 31, 0.45);
    border-radius: 999px;
    padding: 0.45rem 1rem 0.45rem 0.85rem;
  }
  .dot {
    position: relative;
    width: 0.5rem; height: 0.5rem; border-radius: 50%;
    background: var(--wheat);
  }
  .dot::after {
    content: "";
    position: absolute; inset: 0;
    border-radius: 50%;
    background: var(--wheat);
    animation: ping 2s ease-out infinite;
  }

  h1 {
    margin: 0;
    font-size: clamp(1.6rem, 4.2vw, 2.4rem);
    line-height: 1.2;
    font-weight: 600;
    letter-spacing: -0.01em;
    text-wrap: balance;
    color: var(--cream);
  }

  p {
    margin: 0;
    font-size: clamp(0.95rem, 2.2vw, 1.05rem);
    line-height: 1.65;
    color: var(--sage);
    max-width: 25rem;
    text-wrap: pretty;
  }

  /* Ploughed-row progress line */
  .rows {
    width: min(240px, 60vw);
    height: 4px;
    margin-top: 0.5rem;
    border-radius: 999px;
    background: rgba(246, 238, 219, 0.12);
    overflow: hidden;
    position: relative;
  }
  .rows::before {
    content: "";
    position: absolute; inset: 0;
    width: 40%;
    border-radius: inherit;
    background: linear-gradient(90deg, transparent, var(--wheat), transparent);
    animation: plough 2.6s ease-in-out infinite;
  }

  /* Rolling fields along the bottom */
  .fields {
    position: absolute;
    left: 0; right: 0; bottom: 0;
    height: clamp(120px, 20vh, 200px);
    pointer-events: none;
    z-index: 0;
  }
  .fields svg { display: block; width: 100%; height: 100%; }

  footer {
    position: absolute;
    left: 0; right: 0; bottom: 0;
    z-index: 1;
    padding-block: 1.25rem calc(1.25rem + env(safe-area-inset-bottom, 0px));
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 0.35rem 1.25rem;
    font-size: 0.8rem;
    color: var(--sage);
    text-align: center;
  }
  footer .sep { color: var(--wheat); }

  @keyframes rise { from { opacity: 0.001; transform: translateY(14px); } to { opacity: 1; transform: none; } }
  @keyframes ping { 0% { transform: scale(1); opacity: 0.7; } 80%, 100% { transform: scale(2.8); opacity: 0; } }
  @keyframes plough { 0% { transform: translateX(-110%); } 100% { transform: translateX(260%); } }

  @media (prefers-reduced-motion: reduce) {
    .logo, .status { animation: none; }
    .dot::after, .rows::before { animation: none; }
    .rows::before { width: 100%; opacity: 0.5; }
  }
</style>
